name: Keep the box awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-box-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the suggestion box
        run: |
          deadline=$((SECONDS + 3300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors --max-time 75 \
              https://b-k8s4.onrender.com/health
            sleep 480
          done
