<!DOCTYPE html>
<html lang="en" class="locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Cache-Control" content="no-store">
  <link rel="icon" href="/icons/icon-192.png?v=bird" sizes="192x192" type="image/png">
  <title>alfalakhatun.in</title>
  <script>
    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
    });
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(function () {});
    }
  </script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #000;
      color: #fff;
      overflow: hidden;
      height: 100%;
      overscroll-behavior: none;
    }
    html.locked,
    html.locked body {
      position: static;
      overflow: auto;
      height: auto;
      min-height: calc(100% + 160px);
    }
    body {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      width: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding:
        calc(8px + env(safe-area-inset-top))
        12px
        calc(8px + env(safe-area-inset-bottom));
    }
    #notes {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 8px;
      overscroll-behavior: contain;
    }
    .bubble {
      width: fit-content;
      max-width: 75%;
      background: #1c1c1c;
      border-radius: 16px;
      padding: 14px 16px;
      position: relative;
    }
    .mine { align-self: flex-end; margin-left: auto; }
    .theirs { align-self: flex-start; margin-right: auto; }
    .who { color: #9a9a9a; font-size: 12px; margin-bottom: 6px; }
    .bubble p { margin: 0; font-size: 16px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
    .bubble img { max-width: 100%; max-height: 280px; border-radius: 12px; display: block; }
    .tag {
      position: absolute;
      left: 24px;
      bottom: 22px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 10px;
      border-radius: 6px;
      padding: 2px 6px;
    }
    #banner { color: #ffb4ab; font-size: 14px; margin: 8px 0 0; }
    #banner[hidden] { display: none; }
    #retry {
      display: none;
      align-self: flex-start;
      margin-top: 8px;
      color: #fff;
      background: transparent;
      border: 1px solid #fff;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 14px;
    }
    #retry.show { display: inline-block; }
    #install {
      display: none;
      width: 100%;
      min-height: 48px;
      margin: 0 0 8px;
      border: 0;
      border-radius: 24px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: 600;
    }
    #install.show { display: block; }
    #status { color: #9a9a9a; font-size: 12px; padding: 10px 0; }
    #call {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 8px;
      padding: 12px 14px;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      background: #000;
      flex: none;
    }
    #call[hidden] { display: none; }
    #call p { margin: 0; font-size: 15px; }
    #call-actions { display: flex; gap: 8px; }
    #call button {
      border-radius: 20px;
      min-height: 40px;
      padding: 0 14px;
      font-size: 14px;
    }
    #call-answer { border: 0; background: #fff; color: #000; }
    #call-decline, #call-end { background: transparent; color: #fff; border: 1px solid #fff; }
    #composer { display: flex; align-items: center; gap: 8px; flex: none; }
    #pick, #send {
      border: 0;
      background: transparent;
      color: #fff;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      padding: 0;
    }
    #pick:disabled, #send:disabled { color: #9a9a9a; }
    #draft {
      flex: 1;
      min-width: 0;
      max-height: 96px;
      overflow-y: auto;
      border-radius: 28px;
      border: 1px solid #2a2a2a;
      background: #000;
      color: #fff;
      padding: 14px 16px;
      font-size: 16px;
      line-height: 1.3;
      caret-color: #fff;
      white-space: pre-wrap;
      word-break: break-word;
      outline: none;
    }
    #draft:focus { border-color: #fff; }
    #draft[contenteditable="false"] { color: #9a9a9a; }
    #draft:empty::before {
      content: "Type your suggestion...";
      color: #9a9a9a;
    }
    #send {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #2a2a2a;
      flex: none;
    }
    #send.ready { background: #fff; color: #000; }
    #gate {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: calc(18px + env(safe-area-inset-top)) 24px calc(22px + env(safe-area-inset-bottom));
      background:
        linear-gradient(118deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.025) 14%, rgba(0, 0, 0, 0) 36%, rgba(0, 0, 0, 0) 68%, rgba(255, 255, 255, 0.035) 100%),
        #000;
      touch-action: manipulation;
    }
    #gate[hidden] { display: none; }
    #marks {
      margin: auto 0 48px;
      display: flex;
      gap: 18px;
    }
    #marks i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: transparent;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4);
    }
    #marks i.on {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(255, 255, 255, 0.92);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
    }
    #gate.miss #marks { animation: gate-miss 0.28s ease; }
    @keyframes gate-miss {
      0%, 100% { transform: translateX(0); }
      30% { transform: translateX(-8px); }
      70% { transform: translateX(8px); }
    }
    #pad {
      width: min(320px, 100%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px 18px;
      margin-bottom: 8px;
    }
    #pad button {
      height: 64px;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.82);
      font: 300 30px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      border-radius: 16px;
      padding: 0;
    }
    #pad button:active { background: rgba(255, 255, 255, 0.06); color: #fff; }
    #pad .blank { height: 64px; }
  </style>
</head>
<body>
  <div id="gate" role="dialog" aria-label="Code">
    <div id="marks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="pad">
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <span class="blank"></span>
      <button type="button" data-key="0">0</button>
      <button type="button" data-key="back" aria-label="Delete">⌫</button>
    </div>
  </div>
  <div id="notes"></div>
  <p id="banner" hidden></p>
  <div id="call" hidden>
    <p id="call-label"></p>
    <div id="call-actions">
      <button id="call-answer" type="button">Answer</button>
      <button id="call-decline" type="button">Decline</button>
      <button id="call-end" type="button">End</button>
    </div>
  </div>
  <button id="retry" type="button">Try again</button>
  <button id="install" type="button">Install app</button>
  <div id="status"></div>
  <form id="composer" autocomplete="off">
    <button id="pick" type="button" aria-label="Drop a photo or GIF" disabled>
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
      </svg>
    </button>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
    <div id="draft" contenteditable="false" role="textbox" spellcheck="false" enterkeyhint="send" aria-label="Type your suggestion..."></div>
    <button id="send" type="submit" aria-label="Send" disabled>
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </form>
  <script>
    const VANISH_MS = 3000;
    const MAX_BYTES = 8 * 1024 * 1024;
    const notesEl = document.getElementById("notes");
    const statusEl = document.getElementById("status");
    const bannerEl = document.getElementById("banner");
    const retryEl = document.getElementById("retry");
    const installEl = document.getElementById("install");
    const pickEl = document.getElementById("pick");
    const fileEl = document.getElementById("file");
    const draftEl = document.getElementById("draft");
    const sendEl = document.getElementById("send");
    const composer = document.getElementById("composer");
    const callEl = document.getElementById("call");
    const callLabel = document.getElementById("call-label");
    const callAnswer = document.getElementById("call-answer");
    const callDecline = document.getElementById("call-decline");
    const callEnd = document.getElementById("call-end");
    const iceServers = [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }];
    const callPeers = new Map();
    const callPending = new Map();
    let callId = null;
    let callRole = "";
    let rawStream = null;
    let localStream = null;
    let audioCtx = null;
    let gateReady = null;

    const shown = new Map();
    let socket = null;
    let you = null;
    let phase = "connecting";
    let rejected = false;
    let reconnectTimer = 0;

    function setBanner(text) {
      bannerEl.hidden = !text;
      bannerEl.textContent = text || "";
    }

    function draftValue() {
      return (draftEl.innerText || "").replace(/\u00a0/g, " ").replace(/\n/g, " ").trim();
    }

    function refreshSend() {
      const open = phase === "in";
      sendEl.disabled = !open || draftValue() === "";
      sendEl.classList.toggle("ready", !sendEl.disabled);
    }

    function setPhase(next) {
      phase = next;
      const open = next === "in";
      pickEl.disabled = !open;
      draftEl.contentEditable = open ? "true" : "false";
      refreshSend();
      retryEl.classList.toggle("show", next === "rejected");
    }

    function members(count) {
      statusEl.textContent = "You are here · " + count + " of 4";
    }

    function showNote(item) {
      const el = document.createElement("article");
      el.className = "bubble " + (item.mine ? "mine" : "theirs");
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = item.mine ? "Yours" : "Theirs";
      el.appendChild(who);
      if (item.kind === "text") {
        const p = document.createElement("p");
        p.textContent = item.text;
        el.appendChild(p);
      } else {
        const img = document.createElement("img");
        img.alt = item.kind === "gif" ? "Animated GIF" : "Photo";
        img.src = item.url;
        el.appendChild(img);
        if (item.kind === "gif") {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = "GIF";
          el.appendChild(tag);
        }
      }
      notesEl.appendChild(el);
      const timer = setTimeout(() => removeNote(item.id), item.remain);
      shown.set(item.id, { el, url: item.url || "", timer });
      notesEl.scrollTop = notesEl.scrollHeight;
    }

    function removeNote(id) {
      const item = shown.get(id);
      if (!item) return;
      shown.delete(id);
      clearTimeout(item.timer);
      const img = item.el.querySelector("img");
      if (img) img.removeAttribute("src");
      if (item.url) URL.revokeObjectURL(item.url);
      item.el.remove();
    }

    function sniff(bytes) {
      const b = new Uint8Array(bytes);
      if (b.length >= 6 && b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x38) {
        return { kind: "gif", mime: "image/gif", ext: "gif" };
      }
      if (b.length >= 8 && b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) {
        return { kind: "image", mime: "image/png", ext: "png" };
      }
      if (b.length >= 3 && b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) {
        return { kind: "image", mime: "image/jpeg", ext: "jpg" };
      }
      if (b.length >= 12 && b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 &&
          b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) {
        return { kind: "image", mime: "image/webp", ext: "webp" };
      }
      return null;
    }

    function connect() {
      if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
      clearTimeout(reconnectTimer);
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(proto + "//" + location.host + "/ws");
      socket = ws;
      ws.onmessage = (event) => {
        if (socket !== ws) return;
        let payload;
        try { payload = JSON.parse(event.data); } catch (e) { return; }
        if (payload.type === "welcome") {
          you = payload.you;
          rejected = false;
          setPhase("in");
          members(payload.occupancy || 1);
          setBanner("");
        } else if (payload.type === "presence") {
          if (phase === "in") members(payload.occupancy || 1);
        } else if (payload.type === "rejected") {
          rejected = true;
          setPhase("rejected");
          statusEl.textContent = payload.message || "This room already has four people.";
          const el = document.createElement("article");
          el.className = "bubble theirs";
          const p = document.createElement("p");
          p.textContent = statusEl.textContent;
          el.appendChild(p);
          notesEl.appendChild(el);
        } else if (payload.type === "error") {
          if (callRole === "caller" && callPeers.size === 0 &&
              (payload.message === "No one else is here." || payload.message === "A call is already on.")) {
            stopCallLocal();
          }
          setBanner(payload.message || "Couldn't share that one.");
        } else if (payload.type === "call-ready") {
          startOffers(payload);
        } else if (payload.type === "ring") {
          onRing(payload);
        } else if (payload.type === "signal") {
          onSignal(payload);
        } else if (payload.type === "answered") {
          if (callId && payload.id === callId && callRole === "caller") showCall("live", "On a call");
        } else if (payload.type === "mesh") {
          offerToOthers(payload);
        } else if (payload.type === "ended") {
          if (callId && payload.id === callId) stopCallLocal();
        } else if (payload.type === "suggestion") {
          if (payload.sender === you || shown.has(payload.id)) return;
          let url = "";
          if (payload.kind !== "text" && payload.data) {
            const raw = atob(payload.data);
            const bytes = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
            url = URL.createObjectURL(new Blob([bytes], { type: payload.mime || "application/octet-stream" }));
          }
          showNote({
            id: payload.id,
            mine: false,
            kind: payload.kind,
            text: payload.text || "",
            url,
            remain: VANISH_MS,
          });
        }
      };
      ws.onclose = () => {
        if (socket !== ws) return;
        socket = null;
        you = null;
        if (rejected || !admitted) return;
        setPhase("connecting");
        statusEl.textContent = "";
        reconnectTimer = setTimeout(connect, 600);
      };
      ws.onerror = () => {
        try { ws.close(); } catch (e) {}
      };
    }

    draftEl.addEventListener("paste", (event) => {
      event.preventDefault();
      const text = (event.clipboardData && event.clipboardData.getData("text/plain")) || "";
      document.execCommand("insertText", false, text);
    });

    draftEl.addEventListener("input", () => {
      const raw = draftEl.innerText || "";
      if (raw.replace(/\u00a0/g, " ").trim() === "") draftEl.textContent = "";
      if ((draftEl.innerText || "").length > 2000) draftEl.textContent = draftEl.innerText.slice(0, 2000);
      refreshSend();
    });

    let focusToken = 0;
    let lastSentAt = 0;

    function keepKeyboard() {
      const token = ++focusToken;
      const run = () => {
        if (token !== focusToken) return;
        if (draftEl.contentEditable !== "true") return;
        draftEl.focus();
      };
      run();
      requestAnimationFrame(run);
      setTimeout(run, 80);
    }

    function sendDraft() {
      const text = draftValue();
      if (phase !== "in" || !text || !socket || socket.readyState !== WebSocket.OPEN) return;
      const now = Date.now();
      if (now - lastSentAt < 300) return;
      if (text.length > 2000) {
        setBanner("Keep it under 2000 characters.");
        keepKeyboard();
        return;
      }
      lastSentAt = now;
      draftEl.textContent = "";
      refreshSend();
      setBanner("");
      if (text.toLowerCase() === "call") {
        placeCall();
        keepKeyboard();
        return;
      }
      const id = crypto.randomUUID();
      showNote({ id, mine: true, kind: "text", text, url: "", remain: VANISH_MS });
      socket.send(JSON.stringify({ type: "text", id, text }));
      keepKeyboard();
    }

    function unlockAudio() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function showCall(mode, label) {
      callEl.hidden = false;
      callLabel.textContent = label;
      callAnswer.hidden = mode !== "incoming";
      callDecline.hidden = mode !== "incoming";
      callEnd.hidden = mode === "incoming";
    }

    function stopCallLocal() {
      for (const item of callPeers.values()) {
        try { item.pc.close(); } catch (e) {}
        if (item.audio) item.audio.remove();
      }
      callPeers.clear();
      callPending.clear();
      for (const stream of [localStream, rawStream]) {
        if (!stream) continue;
        for (const track of stream.getTracks()) track.stop();
      }
      localStream = null;
      rawStream = null;
      callId = null;
      callRole = "";
      callLabel.textContent = "";
      callEl.hidden = true;
    }

    function sendCall(payload) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify(payload));
    }

    function bagFor(remoteId) {
      let bag = callPending.get(remoteId);
      if (!bag) {
        bag = { descriptions: [], candidates: [] };
        callPending.set(remoteId, bag);
      }
      return bag;
    }

    function voiceSdp(description) {
      if (!description || typeof description.sdp !== "string") return description;
      const map = description.sdp.match(/a=rtpmap:(\d+) opus\/48000(?:\/\d+)?/i);
      if (!map) return description;
      const pt = map[1];
      const line = new RegExp("a=fmtp:" + pt + " ([^\\r\\n]*)");
      let sdp = description.sdp;
      if (line.test(sdp)) {
        sdp = sdp.replace(line, (_, params) => {
          const keep = params.split(";").map((part) => part.trim()).filter((part) => part && !/^useinbandfec=/.test(part) && !/^usedtx=/.test(part));
          keep.push("useinbandfec=1", "usedtx=1");
          return "a=fmtp:" + pt + " " + keep.join(";");
        });
      } else {
        sdp = sdp.replace(
          new RegExp("(a=rtpmap:" + pt + " opus\\/48000(?:\\/\\d+)?)(\\r?\\n)"),
          (_, rtp, nl) => rtp + nl + "a=fmtp:" + pt + " minptime=10;useinbandfec=1;usedtx=1" + nl
        );
      }
      return { type: description.type, sdp };
    }

    function sendVoice(to, description) {
      const shaped = voiceSdp(description);
      sendCall({
        type: "signal",
        id: callId,
        to,
        description: { type: shaped.type, sdp: shaped.sdp },
      });
    }

    function loadGate() {
      if (gateReady) return gateReady;
      unlockAudio();
      if (!audioCtx || !audioCtx.audioWorklet) return Promise.reject(new Error("no worklet"));
      const code = [
        "class VoiceGate extends AudioWorkletProcessor {",
        "  constructor() { super(); this.floor = 0.008; this.gain = 0; this.hang = 0; }",
        "  process(inputs, outputs) {",
        "    const input = inputs[0] && inputs[0][0];",
        "    const output = outputs[0] && outputs[0][0];",
        "    if (!input || !output) return true;",
        "    let sum = 0;",
        "    for (let i = 0; i < input.length; i++) sum += input[i] * input[i];",
        "    const rms = Math.sqrt(sum / input.length);",
        "    if (rms < this.floor) this.floor = this.floor * 0.97 + rms * 0.03;",
        "    else this.floor = this.floor * 0.999 + rms * 0.001;",
        "    if (this.floor < 0.0025) this.floor = 0.0025;",
        "    const open = rms > this.floor * 2.6;",
        "    if (open) this.hang = 20;",
        "    else if (this.hang > 0) this.hang -= 1;",
        "    const target = (open || this.hang > 0) ? 1 : 0.012;",
        "    const speed = target > this.gain ? 0.4 : 0.05;",
        "    this.gain += (target - this.gain) * speed;",
        "    for (let i = 0; i < input.length; i++) output[i] = input[i] * this.gain;",
        "    return true;",
        "  }",
        "}",
        "registerProcessor('voice-gate', VoiceGate);",
      ].join("\n");
      const url = URL.createObjectURL(new Blob([code], { type: "application/javascript" }));
      gateReady = audioCtx.audioWorklet.addModule(url).finally(() => URL.revokeObjectURL(url));
      return gateReady;
    }

    async function shapeVoice(stream, playback) {
      unlockAudio();
      if (!audioCtx) return stream;
      if (audioCtx.state === "suspended") await audioCtx.resume();
      const source = audioCtx.createMediaStreamSource(stream);
      const rumble = audioCtx.createBiquadFilter();
      rumble.type = "highpass";
      rumble.frequency.value = playback ? 100 : 130;
      rumble.Q.value = 0.7;
      const voice = audioCtx.createBiquadFilter();
      voice.type = "highpass";
      voice.frequency.value = playback ? 140 : 180;
      voice.Q.value = 0.7;
      const tin = audioCtx.createBiquadFilter();
      tin.type = "lowpass";
      tin.frequency.value = playback ? 5600 : 4200;
      tin.Q.value = 0.7;
      const tin2 = audioCtx.createBiquadFilter();
      tin2.type = "lowpass";
      tin2.frequency.value = playback ? 6800 : 5200;
      tin2.Q.value = 0.7;
      source.connect(rumble);
      rumble.connect(voice);
      voice.connect(tin);
      tin.connect(tin2);
      let tail = tin2;
      try {
        await loadGate();
        const gate = new AudioWorkletNode(audioCtx, "voice-gate");
        tin2.connect(gate);
        tail = gate;
      } catch (e) {}
      const dest = audioCtx.createMediaStreamDestination();
      tail.connect(dest);
      const track = dest.stream.getAudioTracks()[0];
      if (track) track.contentHint = "speech";
      return dest.stream;
    }

    async function playStream(audio, stream) {
      let shaped = stream;
      try { shaped = await shapeVoice(stream, true); } catch (e) {}
      audio.srcObject = shaped;
      audio.play().catch(() => {});
    }

    function makePeer(remoteId) {
      const existing = callPeers.get(remoteId);
      if (existing) return existing;
      const pc = new RTCPeerConnection({ iceServers });
      const audio = document.createElement("audio");
      audio.autoplay = true;
      audio.playsInline = true;
      audio.hidden = true;
      document.body.appendChild(audio);
      const item = { pc, audio };
      callPeers.set(remoteId, item);
      if (localStream) {
        for (const track of localStream.getTracks()) pc.addTrack(track, localStream);
      }
      pc.onicecandidate = (event) => {
        if (!event.candidate || !callId) return;
        sendCall({ type: "signal", id: callId, to: remoteId, candidate: event.candidate.toJSON() });
      };
      pc.ontrack = (event) => {
        const stream = event.streams[0] || new MediaStream([event.track]);
        playStream(audio, stream);
        if (callRole === "caller") showCall("live", "On a call");
      };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "failed") setBanner("The call could not connect.");
      };
      return item;
    }

    async function ensureMic() {
      if (localStream) return localStream;
      const full = {
        echoCancellation: { ideal: true },
        noiseSuppression: { ideal: true },
        autoGainControl: { ideal: true },
        voiceIsolation: { ideal: true },
        channelCount: { ideal: 1 },
        sampleRate: { ideal: 48000 },
      };
      try {
        rawStream = await navigator.mediaDevices.getUserMedia({ audio: full, video: false });
      } catch (e) {
        rawStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: false,
        });
      }
      for (const track of rawStream.getAudioTracks()) track.contentHint = "speech";
      try {
        localStream = await shapeVoice(rawStream, false);
      } catch (e) {
        localStream = rawStream;
      }
      return localStream;
    }

    async function placeCall() {
      if (callId || phase !== "in" || !socket || socket.readyState !== WebSocket.OPEN) return;
      unlockAudio();
      showCall("outgoing", "Calling...");
      try {
        await ensureMic();
      } catch (e) {
        stopCallLocal();
        setBanner("Allow the microphone to call.");
        return;
      }
      callId = crypto.randomUUID();
      callRole = "caller";
      sendCall({ type: "call", id: callId });
    }

    async function startOffers(payload) {
      if (!callId || payload.id !== callId || callRole !== "caller" || !localStream) return;
      const peers = Array.isArray(payload.peers) ? payload.peers : [];
      if (!peers.length) {
        stopCallLocal();
        setBanner("No one else is here.");
        return;
      }
      for (const remoteId of peers) {
        const item = makePeer(remoteId);
        const offer = await item.pc.createOffer();
        await item.pc.setLocalDescription(offer);
        sendVoice(remoteId, item.pc.localDescription);
      }
    }

    function onRing(payload) {
      if (!payload.id || !payload.from) return;
      if (callId && callId !== payload.id) return;
      callId = payload.id;
      callRole = "receiver";
      bagFor(payload.from);
      showCall("incoming", "Incoming call");
    }

    async function answerCall() {
      if (callRole !== "receiver" || !callId) return;
      unlockAudio();
      try {
        await ensureMic();
      } catch (e) {
        sendCall({ type: "decline", id: callId });
        stopCallLocal();
        setBanner("Allow the microphone to call.");
        return;
      }
      sendCall({ type: "answer", id: callId });
      showCall("live", "On a call");
      for (const remoteId of [...callPending.keys()]) await acceptRemote(remoteId);
    }

    async function offerToOthers(payload) {
      if (!callId || payload.id !== callId || !localStream) return;
      const peers = Array.isArray(payload.peers) ? payload.peers : [];
      for (const remoteId of peers) {
        if (callPeers.has(remoteId)) continue;
        const item = makePeer(remoteId);
        const offer = await item.pc.createOffer();
        await item.pc.setLocalDescription(offer);
        sendVoice(remoteId, item.pc.localDescription);
      }
    }

    async function acceptRemote(remoteId) {
      const bag = bagFor(remoteId);
      const offer = bag.descriptions.find((item) => item.type === "offer");
      if (!offer && !callPeers.has(remoteId)) return;
      const item = makePeer(remoteId);
      if (offer && !item.pc.currentRemoteDescription) {
        await item.pc.setRemoteDescription(offer);
        const answer = await item.pc.createAnswer();
        await item.pc.setLocalDescription(answer);
        sendVoice(remoteId, item.pc.localDescription);
        bag.descriptions = bag.descriptions.filter((item) => item !== offer);
      }
      await flushCandidates(item, bag);
    }

    async function flushCandidates(item, bag) {
      if (!item.pc.currentRemoteDescription) return;
      for (const candidate of bag.candidates) {
        try { await item.pc.addIceCandidate(candidate); } catch (e) {}
      }
      bag.candidates = [];
    }

    async function onSignal(payload) {
      if (!callId || payload.id !== callId || !payload.from) return;
      const item = callPeers.get(payload.from);
      const bag = bagFor(payload.from);
      if (!item || !item.pc.currentRemoteDescription) {
        if (payload.description) bag.descriptions.push(payload.description);
        if (payload.candidate) bag.candidates.push(payload.candidate);
        if (item && payload.description && payload.description.type === "answer" && !item.pc.currentRemoteDescription) {
          await item.pc.setRemoteDescription(payload.description);
          bag.descriptions = bag.descriptions.filter((entry) => entry !== payload.description);
          await flushCandidates(item, bag);
          return;
        }
        if (localStream) await acceptRemote(payload.from);
        return;
      }
      if (payload.description && payload.description.type === "offer") {
        await item.pc.setRemoteDescription(payload.description);
        const answer = await item.pc.createAnswer();
        await item.pc.setLocalDescription(answer);
        sendVoice(payload.from, item.pc.localDescription);
      }
      if (payload.candidate) {
        try { await item.pc.addIceCandidate(payload.candidate); } catch (e) {}
      }
    }

    function declineCall() {
      if (callId) sendCall({ type: "decline", id: callId });
      stopCallLocal();
    }

    function endCall() {
      if (callId) sendCall({ type: "hangup", id: callId });
      stopCallLocal();
    }

    callAnswer.addEventListener("click", () => { answerCall(); });
    callDecline.addEventListener("click", () => { declineCall(); });
    callEnd.addEventListener("click", () => { endCall(); });

    draftEl.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.shiftKey || event.isComposing) return;
      event.preventDefault();
      sendDraft();
    });

    sendEl.addEventListener("pointerdown", (event) => {
      event.preventDefault();
    });
    sendEl.addEventListener("pointerup", (event) => {
      if (event.pointerType === "mouse" && event.button !== 0) return;
      sendDraft();
    });
    composer.addEventListener("submit", (event) => {
      event.preventDefault();
      sendDraft();
    });

    document.addEventListener("pointerdown", (event) => {
      const target = event.target;
      if (target instanceof Node && composer.contains(target)) return;
      focusToken += 1;
      draftEl.blur();
    });

    pickEl.addEventListener("click", () => fileEl.click());

    fileEl.addEventListener("change", async () => {
      const file = fileEl.files && fileEl.files[0];
      fileEl.value = "";
      if (!file || phase !== "in" || !you || !socket || socket.readyState !== WebSocket.OPEN) return;
      const started = performance.now();
      if (file.size > MAX_BYTES) {
        setBanner("Images and GIFs need to be under 8 MB.");
        return;
      }
      const bytes = await file.arrayBuffer();
      if (phase !== "in" || !you || !socket || socket.readyState !== WebSocket.OPEN) return;
      const kind = sniff(bytes);
      if (!kind) {
        setBanner("Use a JPEG, PNG, WEBP, or GIF.");
        return;
      }
      const id = crypto.randomUUID();
      const url = URL.createObjectURL(new Blob([bytes], { type: kind.mime }));
      setBanner("");
      const remain = Math.max(0, VANISH_MS - (performance.now() - started));
      showNote({ id, mine: true, kind: kind.kind, text: "", url, remain });
      const body = new FormData();
      body.append("id", id);
      body.append("file", new File([bytes], "suggestion." + kind.ext, { type: kind.mime }));
      try {
        const response = await fetch("/media", {
          method: "POST",
          headers: { "X-Client-Id": you },
          body,
          cache: "no-store",
        });
        if (!response.ok) {
          let message = "Couldn't share that one.";
          try {
            const payload = await response.json();
            if (payload.detail) message = payload.detail;
          } catch (e) {}
          setBanner(message);
        }
      } catch (e) {
        setBanner("Couldn't share that one.");
      }
    });

    retryEl.addEventListener("click", () => {
      rejected = false;
      notesEl.replaceChildren();
      for (const item of shown.values()) {
        clearTimeout(item.timer);
        if (item.url) URL.revokeObjectURL(item.url);
      }
      shown.clear();
      setPhase("connecting");
      statusEl.textContent = "";
      setBanner("");
      connect();
    });

    let installPrompt = null;
    const installEnabled = false;
    const standalone = window.matchMedia("(display-mode: standalone)").matches
      || window.matchMedia("(display-mode: fullscreen)").matches;
    if (!standalone) {
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        if (!installEnabled) return;
        installPrompt = event;
        installEl.classList.add("show");
      });
      installEl.addEventListener("click", async () => {
        const prompt = installPrompt;
        if (!prompt) return;
        installPrompt = null;
        installEl.classList.remove("show");
        prompt.prompt();
        try { await prompt.userChoice; } catch (e) {}
      });
      window.addEventListener("appinstalled", () => {
        installPrompt = null;
        installEl.classList.remove("show");
      });
    }
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js", { scope: "/", updateViaCache: "none" }).catch(() => {});
    }

    let pinning = false;
    function pinToVisible() {
      if (document.documentElement.classList.contains("locked")) return;
      if (pinning) return;
      pinning = true;
      const view = window.visualViewport;
      const visible = view ? Math.min(window.innerHeight, view.height) : window.innerHeight;
      document.body.style.transform = "none";
      document.body.style.top = "0px";
      document.body.style.height = Math.round(visible) + "px";
      document.body.style.paddingBottom = window.innerHeight - visible > 80 ? "8px" : "";
      pinning = false;
    }
    if (navigator.virtualKeyboard) {
      navigator.virtualKeyboard.overlaysContent = false;
      navigator.virtualKeyboard.addEventListener("geometrychange", pinToVisible);
    }
    if (window.visualViewport) {
      visualViewport.addEventListener("resize", pinToVisible);
      visualViewport.addEventListener("scroll", pinToVisible);
      pinToVisible();
    }
    window.addEventListener("resize", pinToVisible);
    draftEl.addEventListener("focus", () => {
      requestAnimationFrame(pinToVisible);
      setTimeout(pinToVisible, 100);
      setTimeout(pinToVisible, 400);
    });
    draftEl.addEventListener("input", () => requestAnimationFrame(pinToVisible));

    const doorCode = "1001";
    const gateEl = document.getElementById("gate");
    const markEls = document.querySelectorAll("#marks i");
    let admitted = false;
    let entered = "";
    let missTimer = 0;

    function paintMarks() {
      markEls.forEach((mark, index) => mark.classList.toggle("on", index < entered.length));
    }

    function hideAddress() {
      document.documentElement.classList.add("locked");
      if (document.fullscreenElement && document.exitFullscreen) {
        const pending = document.exitFullscreen();
        if (pending && pending.catch) pending.catch(() => {});
      }
    }

    function seal() {
      admitted = false;
      window.__admitted = false;
      entered = "";
      paintMarks();
      gateEl.classList.remove("miss");
      gateEl.hidden = false;
      hideAddress();
      clearTimeout(missTimer);
      clearTimeout(reconnectTimer);
      if (callId && socket && socket.readyState === WebSocket.OPEN) {
        try { socket.send(JSON.stringify({ type: "hangup", id: callId })); } catch (e) {}
      }
      stopCallLocal();
      if (socket) {
        const ws = socket;
        socket = null;
        try { ws.close(); } catch (e) {}
      }
      you = null;
      rejected = false;
      notesEl.replaceChildren();
      for (const item of shown.values()) {
        clearTimeout(item.timer);
        if (item.url) URL.revokeObjectURL(item.url);
      }
      shown.clear();
      setPhase("connecting");
      statusEl.textContent = "";
      setBanner("");
    }

    function admit() {
      if (admitted) return;
      admitted = true;
      window.__admitted = true;
      document.documentElement.classList.remove("locked");
      window.scrollTo(0, 0);
      gateEl.hidden = true;
      setPhase("connecting");
      connect();
    }

    function pushDigit(digit) {
      if (admitted || entered.length >= 4) return;
      entered += digit;
      paintMarks();
      if (entered.length < 4) return;
      if (entered === doorCode) {
        admit();
        return;
      }
      gateEl.classList.add("miss");
      clearTimeout(missTimer);
      missTimer = setTimeout(() => {
        entered = "";
        paintMarks();
        gateEl.classList.remove("miss");
      }, 280);
    }

    gateEl.addEventListener("pointerdown", () => {
      if (!admitted) hideAddress();
    });

    document.getElementById("pad").addEventListener("pointerdown", (event) => {
      const button = event.target.closest("button");
      if (!button || admitted) return;
      hideAddress();
      event.preventDefault();
      const key = button.dataset.key;
      if (key === "back") {
        entered = entered.slice(0, -1);
        paintMarks();
        return;
      }
      pushDigit(key);
    });

    document.addEventListener("keydown", (event) => {
      if (admitted || gateEl.hidden) return;
      if (event.key >= "0" && event.key <= "9") {
        event.preventDefault();
        pushDigit(event.key);
      } else if (event.key === "Backspace") {
        event.preventDefault();
        entered = entered.slice(0, -1);
        paintMarks();
      }
    });

    let leaving = false;
    function closeAndForget() {
      if (leaving) return;
      leaving = true;
      seal();
      try {
        const opened = window.open("", "_self");
        if (opened) opened.close();
      } catch (e) {}
      location.replace("about:blank");
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") closeAndForget();
    });
    window.addEventListener("pagehide", () => {
      if (!leaving) seal();
    });
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) seal();
    });

    seal();
  </script>
</body>
</html>
